<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Open Graph / Preview Meta Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Dashboard Qurban Masjid Al Muhtadin 1447 H" />
  <meta property="og:description" content="Laporan Qurban yang diselenggarakan di Masjid Al Muhtadin 1447 H" />
  <meta property="og:image" content="https://i.postimg.cc/N0Qd8FC8/poster-qurban-al-muhtadin-JADii-I.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dashboard Qurban Masjid Al Muhtadin 1447 H" />
  <meta name="twitter:description" content="Laporan Qurban yang diselenggarakan di Masjid Al Muhtadin 1447 H" />
  <meta name="twitter:image" content="https://i.postimg.cc/N0Qd8FC8/poster-qurban-al-muhtadin-JADii-I.webp" />

  <title>Dashboard Qurban Masjid Al Muhtadin 1447 H</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #F0D080;
      --green: #1B6B3A;
      --green-light: #2E9E5B;
      --dark: #1A1208;
      --cream: #FAF6EE;
    }

    body {
      min-height: 100vh;
      background: #f5f0e8;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* HEADER */
    .header {
      position: relative;
      width: 100%;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding: 40px 20px;
    }

    .header-bg {
      position: absolute; inset: 0;
      background-image: url('https://i.postimg.cc/N0Qd8FC8/poster-qurban-al-muhtadin-JADii-I.webp');
      background-size: cover;
      background-position: center top;
      filter: brightness(0.35) saturate(0.8);
    }

    .header-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(10,6,2,0.4) 0%, rgba(10,6,2,0.85) 100%);
    }

    .header-content {
      position: relative; z-index: 2;
      animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--green), var(--green-light));
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(22px, 5vw, 36px);
      color: var(--gold-light);
      line-height: 1.3;
      margin-bottom: 10px;
      text-shadow: 0 2px 20px rgba(201,168,76,0.3);
    }

    .header p {
      color: rgba(250,246,238,0.65);
      font-size: 13px;
      max-width: 480px;
    }

    .ornament {
      display: flex; align-items: center; gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .ornament-line {
      width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .ornament-line.right {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .ornament-dot {
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }

    /* DASHBOARD SECTION */
    .dashboard-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-title h2 {
      font-family: 'Amiri', serif;
      font-size: 22px;
      color: var(--green);
    }

    .section-title .line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
    }

    .iframe-wrapper {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
      border: 1px solid rgba(201,168,76,0.25);
      background: white;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      border: none;
      display: block;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 24px;
      background: var(--dark);
      color: rgba(250,246,238,0.35);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .footer span {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-bg"></div>
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="ornament">
        <div class="ornament-line"></div>
        <div class="ornament-dot"></div>
        <div class="ornament-line right"></div>
      </div>
      <div class="badge">Idul Adha 1447 H</div>
      <h1>Dashboard Qurban<br>Masjid Al Muhtadin</h1>
      <p>Laporan lengkap pelaksanaan Qurban di Masjid Al Muhtadin 1447 H</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard-section">
    <div class="section-title">
      <h2>📊 Laporan Qurban</h2>
      <div class="line"></div>
    </div>
    <div class="iframe-wrapper">
      <iframe
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSpxpgONLkv1n8qqAvtY9-zZwBhz6PdU0Rx6fa_W4h3sA9m0SeGMOo2UVBGoCSsDmUnlAU1MBt0LA-3/pubhtml?gid=1889678748&single=true"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>Masjid Al Muhtadin</span> &nbsp;·&nbsp; Idul Adha 1447 H &nbsp;·&nbsp; Semoga ibadah qurban kita diterima Allah SWT 🤲
  </div>

</body>
</html>
